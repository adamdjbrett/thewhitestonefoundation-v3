name: Build and Deploy Eleventy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      site:
        description: "XMIT site/domain override"
        required: false
        type: string

concurrency:
  group: eleventy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20
  BUILD_DIR: dist

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy site
        run: npm run build

      - name: Verify build output
        run: |
          test -f "$BUILD_DIR/index.html"
          test -f "$BUILD_DIR/sitemap.xml"
          test -f "$BUILD_DIR/assets/css/index.css"
          test -f "$BUILD_DIR/assets/js/index.js"
          test -f "$BUILD_DIR/pagefind/pagefind-ui.css"
          test -f "$BUILD_DIR/pagefind/pagefind-ui.js"
          test -f "$BUILD_DIR/people/index.html"
          test -f "$BUILD_DIR/team/victor-taylor/index.html"
          test -f "$BUILD_DIR/search/index.html"
          test -f "$BUILD_DIR/_redirects"
          find "$BUILD_DIR" -maxdepth 1 -mindepth 1 -print | sort | head -n 20

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eleventy-dist
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error

  deploy:
    name: Deploy to XMIT
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      XMIT_SITE: ${{ inputs.site || vars.XMIT_SITE || 'thewhitestonefoundation.xmit.dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: eleventy-dist
          path: ${{ env.BUILD_DIR }}

      - name: Deploy to XMIT (CLI)
        env:
          XMIT_KEY: ${{ secrets.XMIT_KEY }}
        run: |
          if [ -z "$XMIT_KEY" ]; then
            echo "XMIT_KEY secret is not set" >&2
            exit 1
          fi
          if [ -z "$XMIT_SITE" ]; then
            echo "XMIT site/domain not provided. Set repo variable XMIT_SITE or pass the workflow_dispatch site input." >&2
            exit 1
          fi
          echo "Deploying $BUILD_DIR to $XMIT_SITE via XMIT CLI"
          npm run deploy:xmit -- "$XMIT_SITE" "$BUILD_DIR"

      - name: Post-deploy summary
        run: |
          echo "Deployment attempt finished for $XMIT_SITE"
          echo "Visit: https://$XMIT_SITE"
